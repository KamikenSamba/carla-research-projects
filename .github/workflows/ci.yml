name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    name: Compile tracked Python sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tracked Python sources
        run: python -m compileall -q research_ogm_project dt_risk_prediction_project

  ogm-offline-tests:
    name: OGM offline tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research_ogm_project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research_ogm_project/requirements-dev.txt

      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate JSON configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in sorted(Path("configs").glob("*.json")):
              with path.open(encoding="utf-8") as config_file:
                  json.load(config_file)
              print(f"validated: {path}")

      - name: Run offline tests
        run: python -m pytest -q
