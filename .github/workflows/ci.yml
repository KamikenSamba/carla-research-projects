name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build and syntax check
        run: python -m compileall -q src scripts tests

      - name: Validate JSON configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in sorted(Path("configs").glob("*.json")):
              with path.open(encoding="utf-8") as config_file:
                  json.load(config_file)
              print(f"validated: {path}")

      - name: Run offline tests
        run: python -m pytest -q
